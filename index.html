<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DA291C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Categorización de Cosechadores – Agrícola Huarmey</title>
<style>
:root{--rojo:#DA291C;--verde:#78BE20;--gris:#8A8178;--rojo-c:#fdeceb;--verde-c:#f0f8e6;--bg:#faf8f5;--txt:#2b2825;--card:#fff;--line:#e6e1da}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom,0)}
header.memb{background:#fff;border-bottom:4px solid var(--rojo);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;justify-content:center;position:relative}
header.memb img{height:84px;max-width:100%;object-fit:contain}
.top{display:flex;gap:6px;position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px))}
.status{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--verde-c);color:#3d6a0c;border:1px solid var(--verde)}
.status.off{background:var(--rojo-c);color:var(--rojo);border-color:var(--rojo)}
h1{text-align:center;font-weight:800;font-size:clamp(20px,5vw,30px);margin:14px 10px 2px;color:var(--rojo)}
.sub{text-align:center;color:var(--gris);margin:0 10px 14px;font-size:15px}
main{max-width:1200px;margin:auto;padding:0 12px 40px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;min-height:48px;cursor:pointer;background:var(--verde);color:#fff}
.btn.rojo{background:var(--rojo)}.btn.gris{background:#fff;color:var(--gris);border:2px solid var(--gris)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar .btn{flex:1 1 140px}
.totales{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-top:5px solid var(--verde)}
.tot:nth-child(2){border-top-color:var(--gris)}.tot:nth-child(3){border-top-color:var(--rojo)}
.tot h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;color:var(--gris)}
.tot .row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;cursor:pointer;border-radius:8px;padding:2px 4px}
.tot .row:hover,.tot .row.sel{background:var(--verde-c)}
.tot .row b{min-width:34px;text-align:right}
.tot .meter{flex:1;height:10px;background:#eee;border-radius:9px;overflow:hidden}.tot .meter i{display:block;height:100%;background:var(--verde)}
.tot:nth-child(3) .meter i{background:var(--rojo)}.tot:nth-child(2) .meter i{background:var(--gris)}
.filtros{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}
label{font-size:12px;font-weight:700;color:var(--gris);display:block;margin-bottom:3px}
input,select{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
input:focus,select:focus{outline:0;border-color:var(--verde)}input.bad{border-color:var(--rojo);background:var(--rojo-c)}
.count{color:var(--gris);font-size:13px;margin:6px 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--verde);border-radius:14px;padding:12px}
.card.pend{border-left-color:#e8a317}.card.err{border-left-color:var(--rojo)}
.card h4{margin:0 0 6px;font-size:16px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.card dt{color:var(--gris);font-weight:700}.card dd{margin:0;text-align:right;word-break:break-word}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px}
.t-Sincronizado{background:var(--verde-c);color:#3d6a0c}.t-Pendiente{background:#fff3d6;color:#9a6700}.t-Error{background:var(--rojo-c);color:var(--rojo)}
.card .btn{padding:6px 12px;min-height:36px;font-size:13px}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;max-height:70vh}
table{border-collapse:collapse;table-layout:fixed;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--rojo);color:#fff;cursor:pointer;user-select:none;position:sticky}
th .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none}
th .rz:hover{background:rgba(255,255,255,.5)}
tr:nth-child(even) td{background:var(--verde-c)}
dialog{border:0;border-radius:16px;padding:16px;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;color:var(--rojo)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid .full{grid-column:1/-1}
.err-msg{color:var(--rojo);font-size:12px;min-height:14px;margin-top:2px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;display:none;max-width:90vw;font-size:14px}
#toast.e{background:var(--rojo)}#toast.o{background:#3d6a0c}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}.top{position:static;margin-left:8px}header.memb{flex-wrap:wrap;gap:6px;justify-content:center}}
</style>
</head>
<body>
<header class="memb">
  <img src="LOGO_HUARMEY.png" alt="Agrícola Huarmey">
  <div class="top"><span id="net" class="status">● En línea</span></div>
</header>
<h1>CATEGORIZACIÓN DE COSECHADORES</h1>
<p class="sub">Dashboard de la categorización del año 2026 a más</p>

<main>
  <div class="bar">
    <button class="btn" id="bSync">🔄 Sincronizar <span id="pend"></span></button>
    <button class="btn rojo" id="bNew">➕ Nuevo registro</button>
    <button class="btn gris" id="bCfg">⚙ Configuración</button>
  </div>

  <section class="totales" id="totales"></section>

  <section class="filtros">
    <div style="grid-column:1/-1"><label for="q">🔎 BUSCAR POR DNI O NOMBRE</label><input id="q" type="search" placeholder="Ej: 45678912 o PEREZ" autocomplete="off"></div>
    <div><label>MODALIDAD</label><select id="fMod"></select></div>
    <div><label>HISTORICO</label><select id="fHis"></select></div>
    <div><label>CATEG. 2026</label><select id="fCat"></select></div>
    <div style="align-self:end"><button class="btn gris" id="bClr" style="width:100%">✖ Limpiar</button></div>
  </section>
  <div class="count" id="count"></div>

  <section class="cards" id="cards"></section>

  <h3 style="color:var(--rojo)">📋 Tabla general</h3>
  <div class="tw"><table id="tbl"></table></div>
</main>

<dialog id="dCfg">
  <h2>⚙ Configuración</h2>
  <label>URL de Apps Script (termina en /exec)</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label style="margin-top:8px">Token de acceso</label><input id="cTok" type="password" placeholder="Token secreto" autocomplete="off">
  <div class="bar" style="margin:14px 0 0"><button class="btn" id="cSave">Guardar</button><button class="btn gris" onclick="this.closest('dialog').close()">Cerrar</button></div>
</dialog>

<dialog id="dForm">
  <h2 id="fTitle">Registro</h2>
  <form id="frm" novalidate><div class="fgrid" id="fields"></div>
    <div class="bar" style="margin:14px 0 0"><button class="btn" type="submit">💾 Guardar</button><button class="btn gris" type="button" onclick="this.closest('dialog').close()">Cancelar</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script>
'use strict';
/* ========= Módulo: constantes ========= */
const FIELDS = ['DNI','NOMBRE TRABAJADOR','MODALIDAD','HISTORICO','CUMP. %','TOTAL DIAS','CATEG. 2026','RANGO %','ORDEN_HISTORICO','ASISTENCIA ACTUAL'];
const NUMERIC = new Set(['CUMP. %','TOTAL DIAS','RANGO %','ORDEN_HISTORICO','ASISTENCIA ACTUAL']);
const ICON = {'DNI':'🪪','NOMBRE TRABAJADOR':'👤','MODALIDAD':'🧺','HISTORICO':'📜','CUMP. %':'✅','TOTAL DIAS':'📅','CATEG. 2026':'🍎','RANGO %':'📊','ORDEN_HISTORICO':'🔢','ASISTENCIA ACTUAL':'🌱'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const num = v => { const n = parseFloat(String(v).replace('%','').replace(',','.')); return isNaN(n) ? null : n; };

/* ========= Módulo: IndexedDB ========= */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('huarmey_categorizacion', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('workers', {keyPath:'DNI'}); r.result.createObjectStore('meta', {keyPath:'k'}); };
    r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => rej(r.error);
  });
  const tx = (st, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(st, mode), s = t.objectStore(st), q = fn(s);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
  return { open,
    all: () => tx('workers','readonly',s => s.getAll()),
    put: r => tx('workers','readwrite',s => s.put(r)),
    putMany: rs => tx('workers','readwrite',s => rs.forEach(r => s.put(r))),
    getMeta: async k => (await tx('meta','readonly',s => s.get(k)))?.v,
    setMeta: (k,v) => tx('meta','readwrite',s => s.put({k,v})) };
})();

/* ========= Módulo: sincronización con Google Sheets (Apps Script) ========= */
const Sync = (() => {
  let busy = false;
  const cfg = async () => ({url: await DB.getMeta('url'), tok: await DB.getMeta('tok')});
  const clean = r => { const o = {}; FIELDS.forEach(f => o[f] = r[f] ?? ''); return o; };
  async function run(manual) {
    if (busy) return; const {url, tok} = await cfg();
    if (!url || !tok) { if (manual) toast('Configura la URL y el token (⚙)', 'e'); return; }
    if (!navigator.onLine) { if (manual) toast('Sin conexión. Se sincronizará al volver internet.'); return; }
    busy = true; $('#bSync').disabled = true;
    try {
      // 1) Enviar pendientes/error. text/plain evita preflight CORS en Apps Script.
      const todos = await DB.all(), pend = todos.filter(r => r._sync !== 'Sincronizado');
      for (let i = 0; i < pend.length; i += 50) {
        const lote = pend.slice(i, i + 50);
        const r = await fetchJSON(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({token: tok, records: lote.map(clean)})});
        if (!r.ok) throw new Error(r.error || 'Error del servidor');
        for (const x of r.results) {
          const rec = lote.find(l => l.DNI === x.dni); if (!rec) continue;
          rec._sync = x.ok ? 'Sincronizado' : 'Error'; rec._err = x.ok ? '' : x.error; await DB.put(rec);
        }
      }
      // 2) Descargar datos vigentes (no pisa registros locales sin sincronizar)
      const r = await fetchJSON(`${url}?action=list&token=${encodeURIComponent(tok)}`);
      if (!r.ok) throw new Error(r.error || 'Error del servidor');
      const locales = new Map((await DB.all()).map(x => [x.DNI, x]));
      const nuevos = r.data.filter(d => !(locales.get(d.DNI) && locales.get(d.DNI)._sync !== 'Sincronizado')).map(d => ({...d, _sync:'Sincronizado'}));
      await DB.putMany(nuevos); await DB.setMeta('last', Date.now());
      if (manual) toast('Sincronización completada', 'o');
    } catch (e) { toast('No se pudo sincronizar: ' + e.message, 'e'); }
    finally { busy = false; $('#bSync').disabled = false; await App.load(); }
  }
  async function fetchJSON(url, opt) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 30000);
    try { const res = await fetch(url, {...opt, signal: c.signal, redirect:'follow'}); if (!res.ok) throw new Error('HTTP ' + res.status); return await res.json(); }
    finally { clearTimeout(t); }
  }
  return { run };
})();

/* ========= Módulo: UI ========= */
let DATA = [], sortF = null, sortAsc = true;
const widths = JSON.parse(localStorage.getItem('colw') || '{}');
function toast(m, t='') { const e = $('#toast'); e.textContent = m; e.className = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500); }

const App = {
  async load() { DATA = await DB.all(); this.fillFilters(); this.render(); },
  fillFilters() {
    [['#fMod','MODALIDAD'],['#fHis','HISTORICO'],['#fCat','CATEG. 2026']].forEach(([id, f]) => {
      const s = $(id), cur = s.value, vals = [...new Set(DATA.map(d => d[f]).filter(v => v !== ''))].sort((a,b) => String(a).localeCompare(b, 'es', {numeric:true}));
      s.innerHTML = `<option value="">Todos</option>` + vals.map(v => `<option>${esc(v)}</option>`).join('');
      s.value = vals.includes(cur) ? cur : '';
    });
  },
  filtered() {
    const q = norm($('#q').value.trim()), m = $('#fMod').value, h = $('#fHis').value, c = $('#fCat').value;
    return DATA.filter(d => (!q || norm(d.DNI).includes(q) || norm(d['NOMBRE TRABAJADOR']).includes(q)) && (!m || d.MODALIDAD === m) && (!h || d.HISTORICO === h) && (!c || d['CATEG. 2026'] === c));
  },
  render() {
    const list = this.filtered(), pend = DATA.filter(d => d._sync !== 'Sincronizado').length;
    $('#pend').textContent = pend ? `(${pend})` : '';
    $('#count').textContent = `${list.length} de ${DATA.length} registros`;
    // Totales (sobre el filtro actual): clic en una fila aplica el filtro
    $('#totales').innerHTML = [['MODALIDAD','🧺','#fMod'],['HISTORICO','📜','#fHis'],['CATEG. 2026','🍎','#fCat']].map(([f, ic, id]) => {
      const cnt = {}; list.forEach(d => { const k = d[f] || '(vacío)'; cnt[k] = (cnt[k] || 0) + 1; });
      const mx = Math.max(1, ...Object.values(cnt)), sel = $(id).value;
      const rows = Object.entries(cnt).sort((a,b) => b[1] - a[1]).map(([k, n]) => `<div class="row ${k === sel ? 'sel' : ''}" data-id="${id}" data-v="${esc(k)}"><span style="min-width:90px">${esc(k)}</span><span class="meter"><i style="width:${n / mx * 100}%"></i></span><b>${n}</b></div>`).join('');
      return `<div class="tot"><h3>${ic} ${f}</h3>${rows || '<small>Sin datos</small>'}</div>`;
    }).join('');
    // Fichas
    $('#cards').innerHTML = list.length ? list.map(d => `<article class="card ${d._sync === 'Pendiente' ? 'pend' : d._sync === 'Error' ? 'err' : ''}">
      <h4>${ICON['NOMBRE TRABAJADOR']} ${esc(d['NOMBRE TRABAJADOR'])}</h4>
      <dl>${FIELDS.filter(f => f !== 'NOMBRE TRABAJADOR').map(f => `<dt>${ICON[f]} ${f}</dt><dd>${esc(d[f])}</dd>`).join('')}</dl>
      <div class="foot"><span class="tag t-${d._sync}" title="${esc(d._err || '')}">${d._sync}${d._err ? ': ' + esc(d._err) : ''}</span><button class="btn gris" data-edit="${esc(d.DNI)}">✏ Editar</button></div></article>`).join('')
      : '<p style="grid-column:1/-1;text-align:center;color:var(--gris)">Sin registros. Configura ⚙ y sincroniza, o crea uno nuevo.</p>';
    this.table(list);
  },
  table(list) {
    if (sortF) { const nm = NUMERIC.has(sortF); list = [...list].sort((a,b) => { let x = a[sortF], y = b[sortF];
      if (nm) { x = num(x); y = num(y); if (x === null) return 1; if (y === null) return -1; return sortAsc ? x - y : y - x; }
      return sortAsc ? String(x).localeCompare(y, 'es', {numeric:true}) : String(y).localeCompare(x, 'es', {numeric:true}); }); }
    const cg = `<colgroup>${FIELDS.map(f => `<col style="width:${widths[f] || (f === 'NOMBRE TRABAJADOR' ? 240 : 120)}px">`).join('')}</colgroup>`;
    const th = FIELDS.map(f => `<th data-f="${f}">${f} ${sortF === f ? (sortAsc ? '▲' : '▼') : ''}<span class="rz"></span></th>`).join('');
    $('#tbl').innerHTML = cg + `<thead><tr>${th}</tr></thead><tbody>${list.map(d => `<tr>${FIELDS.map(f => `<td title="${esc(d[f])}">${esc(d[f])}</td>`).join('')}</tr>`).join('')}</tbody>`;
    const tw = FIELDS.reduce((s, f) => s + (widths[f] || (f === 'NOMBRE TRABAJADOR' ? 240 : 120)), 0); $('#tbl').style.width = tw + 'px';
  },
  openForm(dni) {
    const d = dni ? DATA.find(x => x.DNI === dni) : {};
    $('#fTitle').textContent = dni ? 'Editar registro' : 'Nuevo registro';
    $('#fields').innerHTML = FIELDS.map(f => `<div class="${f === 'NOMBRE TRABAJADOR' ? 'full' : ''}"><label>${ICON[f]} ${f}</label>
      <input name="${f}" value="${esc(d[f] || '')}" ${f === 'DNI' ? 'inputmode="numeric" maxlength="8" ' + (dni ? 'readonly' : '') : NUMERIC.has(f) ? 'inputmode="decimal"' : ''}><div class="err-msg"></div></div>`).join('');
    $('#dForm').showModal();
  },
  validate(o) {
    const e = {};
    if (!/^\d{8}$/.test(o.DNI)) e.DNI = 'El DNI debe tener 8 dígitos';
    if (o['NOMBRE TRABAJADOR'].trim().length < 3) e['NOMBRE TRABAJADOR'] = 'Ingresa el nombre (mín. 3 letras)';
    ['MODALIDAD','HISTORICO','CATEG. 2026'].forEach(f => { if (!o[f].trim()) e[f] = 'Campo obligatorio'; });
    NUMERIC.forEach(f => { if (o[f].trim() !== '' && num(o[f]) === null) e[f] = 'Debe ser numérico'; });
    if (o['TOTAL DIAS'].trim() !== '' && (num(o['TOTAL DIAS']) < 0 || num(o['TOTAL DIAS']) > 366)) e['TOTAL DIAS'] = 'Entre 0 y 366';
    return e;
  }
};

/* ========= Eventos ========= */
$('#bNew').onclick = () => App.openForm();
$('#bSync').onclick = () => Sync.run(true);
$('#bClr').onclick = () => { $('#q').value = ''; ['#fMod','#fHis','#fCat'].forEach(i => $(i).value = ''); App.render(); };
['#q','#fMod','#fHis','#fCat'].forEach(i => $(i).addEventListener('input', () => App.render()));
$('#totales').onclick = e => { const r = e.target.closest('.row'); if (!r) return; const s = $(r.dataset.id); s.value = s.value === r.dataset.v ? '' : r.dataset.v; App.render(); };
$('#cards').onclick = e => { const b = e.target.closest('[data-edit]'); if (b) App.openForm(b.dataset.edit); };
$('#bCfg').onclick = async () => { $('#cUrl').value = (await DB.getMeta('url')) || ''; $('#cTok').value = (await DB.getMeta('tok')) || ''; $('#dCfg').showModal(); };
$('#cSave').onclick = async () => {
  const u = $('#cUrl').value.trim(), t = $('#cTok').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast('La URL debe ser de Apps Script y terminar en /exec', 'e');
  if (t.length < 8) return toast('Token inválido', 'e');
  await DB.setMeta('url', u); await DB.setMeta('tok', t); $('#dCfg').close(); toast('Configuración guardada', 'o'); Sync.run(true);
};
$('#frm').onsubmit = async ev => {
  ev.preventDefault(); const o = {}; FIELDS.forEach(f => o[f] = $('#frm').elements[f].value.trim());
  const errs = App.validate(o);
  document.querySelectorAll('#fields input').forEach(i => { const m = errs[i.name]; i.classList.toggle('bad', !!m); i.nextElementSibling.textContent = m || ''; });
  if (Object.keys(errs).length) return toast('Revisa los campos marcados', 'e');
  const exists = DATA.find(d => d.DNI === o.DNI), isNew = !$('#frm').elements.DNI.readOnly;
  if (isNew && exists) return toast('Ya existe un registro con ese DNI', 'e');
  await DB.put({...o, _sync: 'Pendiente', _err: ''}); $('#dForm').close();
  toast(navigator.onLine ? 'Guardado. Sincronizando…' : 'Guardado sin conexión (Pendiente)', 'o'); await App.load(); Sync.run(false);
};
// Tabla: ordenar y redimensionar columnas (mouse y táctil)
$('#tbl').addEventListener('click', e => { if (e.target.classList.contains('rz')) return; const th = e.target.closest('th'); if (!th) return;
  const f = th.dataset.f; sortAsc = sortF === f ? !sortAsc : true; sortF = f; App.render(); });
$('#tbl').addEventListener('pointerdown', e => {
  if (!e.target.classList.contains('rz')) return; e.preventDefault(); const th = e.target.parentElement, f = th.dataset.f, x0 = e.clientX, w0 = th.offsetWidth;
  const mv = ev => { const w = Math.max(60, w0 + ev.clientX - x0); widths[f] = w; const i = FIELDS.indexOf(f); $('#tbl').querySelectorAll('col')[i].style.width = w + 'px'; $('#tbl').style.width = FIELDS.reduce((s, k) => s + (widths[k] || (k === 'NOMBRE TRABAJADOR' ? 240 : 120)), 0) + 'px'; };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); localStorage.setItem('colw', JSON.stringify(widths)); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
});
// Conexión
function net() { const on = navigator.onLine; const n = $('#net'); n.textContent = on ? '● En línea' : '● Sin conexión'; n.classList.toggle('off', !on); }
addEventListener('online', () => { net(); toast('Conexión recuperada'); Sync.run(false); });
addEventListener('offline', net);

/* ========= Inicio ========= */
(async () => {
  net(); await DB.open(); await App.load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
  Sync.run(false);
  setInterval(() => Sync.run(false), 5 * 60 * 1000); // refresco cada 5 min cuando hay internet
})();
</script>
</body>
